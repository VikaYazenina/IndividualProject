<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вход · ContentHarvest</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <a href="/login" class="brand">ContentHarvest</a>
      <h1>Войдите, чтобы увидеть свои источники</h1>

      {% if error %}<div class="auth-error">{{ error }}</div>{% endif %}

      <form method="post" action="/login" class="auth-form">
        <label>Email
          <input type="email" name="email" required autofocus>
        </label>
        <label>Пароль
          <input type="password" name="password" required>
        </label>
        <button type="submit" class="btn-primary">Войти</button>
      </form>

      <div class="auth-switch">
        Ещё нет аккаунта? <a href="/register">Зарегистрироваться</a>
      </div>
    </div>
  </div>
</body>
</html>
