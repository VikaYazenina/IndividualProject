name: Docker build

on:
  push:
    branches: [main]

jobs:
  docker:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Сборка Docker-образа
        run: docker build -t contentharvest:${{ github.sha }} .
      - name: Проверка запуска контейнера
        run: |
          docker run -d --name ch -p 8000:80 -e SECRET_KEY=ci-test contentharvest:${{ github.sha }}
          curl --retry 15 --retry-delay 2 --retry-connrefused -fsS http://localhost:8000/login > /dev/null
          docker logs ch
